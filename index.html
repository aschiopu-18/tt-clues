<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1530">
<meta name="robots" content="noindex">
<title>Tilburg Treasures: your clue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1530'/%3E%3Cpath d='M9 15v-3a7 7 0 0 1 14 0v3' stroke='%23edb83d' stroke-width='3' fill='none'/%3E%3Crect x='7' y='15' width='18' height='12' rx='3' fill='%23edb83d'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0b1530; --bg2: #101d40; --card: #13224a; --card2: #182a59; --ink: #ffffff; --muted: #b8c3dc;
    --accent: #edb83d; --accent-ink: #1a1405; --line: rgba(255,255,255,0.12);
    --no: #ff7a7a; --yes: #6fe0a0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center;
    background: radial-gradient(120% 60% at 50% -10%, #1c3373 0%, var(--bg) 60%) fixed, var(--bg);
  }
  main { width: 100%; max-width: 460px; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .badge { width: 46px; height: 46px; flex: none; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); display: grid; place-items: center; }
  .brand { color: var(--accent); font-weight: 700; letter-spacing: .08em; font-size: 12px; text-transform: uppercase; }
  h1 { font-size: 24px; margin: 1px 0 0; line-height: 1.2; overflow-wrap: anywhere; }
  .who { display: flex; gap: 6px; margin: 0 0 18px; }
  .seat { flex: 1; height: 8px; border-radius: 4px; background: var(--line); }
  .seat.me { background: var(--accent); }
  .who-label { color: var(--muted); font-size: 15px; margin: -10px 0 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 14px; }
  .reveal {
    width: 100%; border: 0; border-radius: 14px; padding: 30px 16px; cursor: pointer;
    background: var(--accent); color: var(--accent-ink); font-family: inherit; font-weight: 750; font-size: 21px; line-height: 1.3;
    box-shadow: 0 6px 0 #b4851f; transition: transform .08s, box-shadow .08s;
  }
  .reveal:active { transform: translateY(4px); box-shadow: 0 2px 0 #b4851f; }
  .reveal small { display: block; font-weight: 500; font-size: 14px; opacity: .75; margin-top: 4px; }
  .clues { list-style: none; margin: 0; padding: 0; }
  .clues li { font-size: 22px; font-weight: 650; line-height: 1.35; padding: 12px 0; animation: pop .35s ease-out both; }
  .clues li:nth-child(2) { animation-delay: .08s; }
  .clues li:nth-child(3) { animation-delay: .16s; }
  .clues li + li { border-top: 1px solid var(--line); }
  .clues .place { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: none; } }
  .rb-title { margin: 0 0 4px; font-weight: 700; font-size: 18px; }
  .rb-sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .rb-pic { font-size: 54px; line-height: 1.2; text-align: center; padding: 14px 0 6px; letter-spacing: .04em; }
  .rb-len { text-align: center; color: var(--muted); font-size: 14px; margin: 0 0 14px; letter-spacing: .12em; }
  .rb-row { display: flex; gap: 8px; }
  .rb-row input {
    flex: 1; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: rgba(255,255,255,0.08);
    color: var(--ink); font: 650 20px/1 system-ui, sans-serif; padding: 14px; text-transform: uppercase; letter-spacing: .05em;
  }
  .rb-row input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .rb-row button { border: 0; border-radius: 12px; background: var(--accent); color: var(--accent-ink); font: 750 17px system-ui, sans-serif; padding: 0 18px; cursor: pointer; }
  .rb-msg { min-height: 22px; margin: 10px 0 0; font-size: 15px; color: var(--muted); }
  .rb-msg.bad { color: var(--no); }
  .rb-give { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 14px; padding: 6px 0 0; cursor: pointer; }
  .shake { animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  .solved { color: var(--yes); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 6px; }
  .hide { margin-top: 12px; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: 15px; cursor: pointer; }
  .tips { color: var(--muted); font-size: 15px; margin: 0; padding: 0; list-style: none; counter-reset: t; }
  .tips li { margin: 6px 0; padding-left: 32px; position: relative; }
  .tips li::before { counter-increment: t; content: counter(t); position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--card2); color: var(--accent); font-weight: 700; font-size: 13px; display: grid; place-items: center; }
  .tips b { color: var(--ink); }
  .pad-head { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 4px; }
  .pad-title { font-weight: 650; font-size: 15px; color: var(--ink); margin: 0; }
  .pad-reset { background: none; border: 0; color: var(--muted); font: inherit; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 4px; }
  .pad-help { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: 34px repeat(10, 1fr); gap: 4px; align-items: center; }
  .grid .rowlab { color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; }
  .grid .collab { color: var(--muted); font-size: 12px; text-align: center; }
  .cell {
    aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--line); background: rgba(255,255,255,0.05);
    color: var(--ink); font: 700 16px/1 system-ui, sans-serif; display: grid; place-items: center; cursor: pointer; padding: 0; position: relative;
  }
  .cell.no { color: rgba(255,255,255,0.28); background: rgba(255,122,122,0.08); border-color: rgba(255,122,122,0.25); }
  .cell.no::after { content: ""; position: absolute; left: 18%; right: 18%; top: 50%; height: 2px; background: var(--no); transform: rotate(-35deg); border-radius: 1px; }
  .cell.yes { background: var(--yes); color: #062814; border-color: var(--yes); }
  .answer { display: flex; justify-content: center; gap: 8px; margin-top: 14px; }
  .answer span { width: 54px; height: 62px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 30px; font-weight: 800; color: var(--muted); }
  .answer span.known { color: var(--yes); border-color: rgba(111,224,160,0.5); }
  .foot { color: var(--muted); font-size: 12px; text-align: center; margin-top: 8px; opacity: .7; }
  .error .card p { color: var(--muted); margin: 0; }
  @media (prefers-reduced-motion: reduce) { .clues li { animation: none; } .reveal { transition: none; } }
</style>
</head>
<body>
<main id="app"></main>
<script>
(function () {
  var POS = ["first", "second", "third", "fourth"];
  var app = document.getElementById("app");
  var LOCK = '<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M9 15v-3a7 7 0 0 1 14 0v3" stroke="#edb83d" stroke-width="3" fill="none"/><rect x="7" y="15" width="18" height="12" rx="3" fill="#edb83d"/><circle cx="16" cy="21" r="2" fill="#13224a"/></svg>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fromBase64Url(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  // Emoji rebuses: each player solves one to unlock their clue. The app sends a random seed in
  // the link; player p gets REBUS[(seed + p - 1) % REBUS.length], so teammates never share one.
  // a = accepted answers (compared without spaces, hyphens or case).
  var REBUS = [
    { e: "🐝 + 🍃", a: ["belief"] },
    { e: "☀️ + 👓", a: ["sunglasses"] },
    { e: "🌧️ + 🏹", a: ["rainbow"] },
    { e: "⭐ + 🐟", a: ["starfish"] },
    { e: "🦶 + ⚽", a: ["football"] },
    { e: "🐎 + 👞", a: ["horseshoe"] },
    { e: "🧈 + 🪰", a: ["butterfly"] },
    { e: "🌙 + 💡", a: ["moonlight"] },
    { e: "🔑 + 🕳️", a: ["keyhole"] },
    { e: "🌲 + 🍎", a: ["pineapple"] },
    { e: "☕ + 🎂", a: ["cupcake"] },
    { e: "🌊 + 🐎", a: ["seahorse"] },
    { e: "❄️ + 👨", a: ["snowman"] },
    { e: "🏠 + 🪰", a: ["housefly"] },
    { e: "🐶 + 🏠", a: ["doghouse", "kennel"] },
    { e: "📖 + 🐛", a: ["bookworm"] },
    { e: "✋ + 👜", a: ["handbag"] },
    { e: "🥚 + 🌱", a: ["eggplant"] },
    { e: "🐉 + 🪰", a: ["dragonfly"] },
    { e: "🔥 + 👨", a: ["fireman", "firefighter"] },
    { e: "🦷 + 🖌️", a: ["toothbrush"] },
    { e: "💧 + 🍈", a: ["watermelon"] },
    { e: "🐱 + 🐟", a: ["catfish"] },
    { e: "🥚 + 🐚", a: ["eggshell"] },
    { e: "🦶 + 🖨️", a: ["footprint"] },
    { e: "🚪 + 🔔", a: ["doorbell"] },
    { e: "🌧️ + 🧥", a: ["raincoat"] },
    { e: "⭐ + 💡", a: ["starlight"] },
    { e: "🔥 + 🪰", a: ["firefly"] },
    { e: "🍯 + 🌙", a: ["honeymoon"] },
    { e: "🌳 + 🏠", a: ["treehouse"] },
    { e: "📚 + 🏪", a: ["bookshop", "bookstore"] },
    { e: "🧺 + ⚽", a: ["basketball"] },
    { e: "🐄 + 👦", a: ["cowboy"] },
    { e: "🌊 + 🐚", a: ["seashell"] },
    { e: "🍳 + 🎂", a: ["pancake"] },
    { e: "🐟 + 🥣", a: ["fishbowl"] },
    { e: "🌧️ + 💧", a: ["raindrop"] },
    { e: "💡 + 🏠", a: ["lighthouse"] },
    { e: "🥜 + 🧈", a: ["peanutbutter"] },
    { e: "🔥 + 🪵", a: ["firewood"] }
  ];

  function norm(s) { return String(s).toLowerCase().replace(/[^a-z]/g, ""); }

  // Same sentences as CluePuzzle.Clue.Text() in the app. Keep the two in sync.
  function clueText(t) {
    var m;
    if ((m = /^S(\d+)$/.exec(t))) return "All four digits add up to " + m[1] + ".";
    if ((m = /^P([1-4])([1-4])=(\d+)$/.exec(t))) return "The " + POS[m[1] - 1] + " and " + POS[m[2] - 1] + " digits add up to " + m[3] + ".";
    if ((m = /^D([1-4])([1-4])=(\d+)$/.exec(t))) return "The " + POS[m[1] - 1] + " digit is " + m[3] + " more than the " + POS[m[2] - 1] + " digit.";
    if ((m = /^M([1-4])([1-4])$/.exec(t))) return "The " + POS[m[1] - 1] + " digit is double the " + POS[m[2] - 1] + " digit.";
    if ((m = /^E([1-4])$/.exec(t))) return "The " + POS[m[1] - 1] + " digit is even.";
    if ((m = /^O([1-4])$/.exec(t))) return "The " + POS[m[1] - 1] + " digit is odd.";
    if ((m = /^G([1-4])([1-4])$/.exec(t))) return "The " + POS[m[1] - 1] + " digit is bigger than the " + POS[m[2] - 1] + " digit.";
    if ((m = /^X([1-4])=(\d)$/.exec(t))) return "The " + POS[m[1] - 1] + " digit is " + m[2] + ".";
    if ((m = /^Q([1-4])~([A-Za-z0-9_-]+)$/.exec(t))) { try { return fromBase64Url(m[2]); } catch (e) { return null; } }
    if (t === "U") return "No digit appears twice.";
    if ((m = /^C(\d)$/.exec(t))) return "There is a " + m[1] + " somewhere in the code.";
    if ((m = /^N(\d)$/.exec(t))) return "There is no " + m[1] + " anywhere in the code.";
    if ((m = /^L([1-4])=(\d)$/.exec(t))) return "The " + POS[m[1] - 1] + " digit is smaller than " + m[2] + ".";
    if ((m = /^H([1-4])=(\d)$/.exec(t))) return "The " + POS[m[1] - 1] + " digit is bigger than " + m[2] + ".";
    if (t === "R") return "The digits go up from left to right.";
    if (t === "F") return "The digits go down from left to right.";
    return null;
  }

  function parse() {
    var raw = location.hash.replace(/^#/, "");
    try { raw = decodeURIComponent(raw); } catch (e) { return null; }
    var parts = raw.split("|");
    // v1|team|player|players|tokens            (clue shown straight away)
    // v2|team|player|players|seed|tokens       (solve a rebus first)
    var v2 = parts.length === 6 && parts[0] === "v2";
    if (!v2 && !(parts.length === 5 && parts[0] === "v1")) return null;
    var player = parseInt(parts[2], 10), players = parseInt(parts[3], 10);
    if (!(player >= 1 && players >= 2 && players <= 5 && player <= players)) return null;
    var rebus = null;
    if (v2) {
      var seed = parseInt(parts[4], 10);
      if (!(seed >= 0)) return null;
      rebus = REBUS[(seed + player - 1) % REBUS.length];
    }
    var tokenPart = parts[v2 ? 5 : 4];
    var tokens = tokenPart ? tokenPart.split(".") : [];
    var clues = tokens.map(function (t) { var s = clueText(t); return s === null ? null : { text: s, place: t.charAt(0) === "Q" }; });
    if (!clues.length || clues.some(function (c) { return c === null; })) return null;
    return { key: raw, team: parts[1] || "Your team", player: player, players: players, clues: clues, rebus: rebus };
  }

  // Notepad state per puzzle link, so a reload or a locked screen doesn't wipe it.
  function loadPad(key) {
    try { var v = JSON.parse(sessionStorage.getItem("pad:" + key)); if (Array.isArray(v) && v.length === 40) return v; } catch (e) {}
    var a = []; for (var i = 0; i < 40; i++) a.push(0); return a;
  }
  function savePad(key, a) { try { sessionStorage.setItem("pad:" + key, JSON.stringify(a)); } catch (e) {} }

  function loadRebus(key) {
    try { var v = JSON.parse(sessionStorage.getItem("rebus:" + key)); if (v && typeof v.wrong === "number") return v; } catch (e) {}
    return { solved: false, wrong: 0 };
  }
  function saveRebus(key, v) { try { sessionStorage.setItem("rebus:" + key, JSON.stringify(v)); } catch (e) {} }

  function renderError() {
    app.className = "error";
    app.innerHTML =
      '<div class="top"><div class="badge">' + LOCK + '</div><div><div class="brand">Tilburg Treasures</div><h1>No clue found</h1></div></div>' +
      '<div class="card"><p>Scan the QR code on your team’s phone with your camera to get your clue. If it still doesn’t work, ask your team to show the QR code again.</p></div>';
  }

  function render(d) {
    app.className = "";
    var n = d.clues.length, plural = n > 1 ? "s" : "";
    var seats = "";
    for (var s = 1; s <= d.players; s++) seats += '<div class="seat' + (s === d.player ? " me" : "") + '"></div>';

    var grid = '<div></div>';
    for (var c = 0; c < 10; c++) grid += '<div class="collab">' + c + '</div>';
    for (var r = 0; r < 4; r++) {
      grid += '<div class="rowlab">' + (r + 1) + (r === 0 ? "st" : r === 1 ? "nd" : r === 2 ? "rd" : "th") + '</div>';
      for (var c2 = 0; c2 < 10; c2++)
        grid += '<button class="cell" data-i="' + (r * 10 + c2) + '" aria-label="' + POS[r] + ' digit ' + c2 + '">' + c2 + '</button>';
    }

    app.innerHTML =
      '<div class="top"><div class="badge">' + LOCK + '</div><div><div class="brand">Tilburg Treasures · Split clues</div><h1>' + esc(d.team) + '</h1></div></div>' +
      '<div class="who">' + seats + '</div>' +
      '<p class="who-label">You are player ' + d.player + ' of ' + d.players + (d.player === 1 ? " (the team phone)" : "") + '</p>' +
      '<div class="card" id="clueCard"></div>' +
      '<div class="card"><ol class="tips">' +
        (d.rebus ? '<li><b>Solve your picture puzzle</b> to unlock your clue' + plural + '.</li>' : '') +
        '<li><b>Read your clue' + plural + ' out loud</b> to the team.</li>' +
        '<li>Listen to everyone. Nobody can solve it alone.</li>' +
        '<li>Work out the 4-digit code and dial it on the team phone.</li>' +
      '</ol></div>' +
      '<div class="card">' +
        '<div class="pad-head"><p class="pad-title">Notepad</p><button class="pad-reset" id="padReset">Clear</button></div>' +
        '<p class="pad-help">Tap once to cross a digit out, twice to mark it as sure.</p>' +
        '<div class="grid" id="grid">' + grid + '</div>' +
        '<div class="answer" id="answer"></div>' +
      '</div>' +
      '<p class="foot">Only on your phone. Nothing is sent anywhere.</p>';

    var card = document.getElementById("clueCard");
    var st = loadRebus(d.key);
    function show() {
      card.innerHTML = (d.rebus ? '<p class="solved">✓ ' + esc(d.rebus.a[0].toUpperCase()) + ' — clue' + plural + ' unlocked</p>' : '') +
        '<ul class="clues">' + d.clues.map(function (c) {
        return "<li>" + (c.place ? '<span class="place">Look around you</span><br>' : "") + esc(c.text) + "</li>";
      }).join("") + '</ul>';
    }
    function puzzle() {
      var len = norm(d.rebus.a[0]).length, first = d.rebus.a[0].charAt(0).toUpperCase();
      card.innerHTML =
        '<p class="rb-title">Unlock your clue' + plural + '</p>' +
        '<p class="rb-sub">Which word do the pictures make?</p>' +
        '<div class="rb-pic" aria-label="picture puzzle">' + d.rebus.e + '</div>' +
        '<p class="rb-len">' + len + ' letters' + (st.wrong >= 2 ? ' · starts with ' + first : '') + '</p>' +
        '<form class="rb-row" id="rbForm" autocomplete="off"><input id="rbIn" autocapitalize="characters" spellcheck="false" aria-label="Your answer" placeholder="Answer"><button>Check</button></form>' +
        '<p class="rb-msg" id="rbMsg"></p>' +
        (st.wrong >= 4 ? '<button class="rb-give" id="rbGive">Stuck? Show the answer</button>' : '');
      var form = document.getElementById("rbForm"), input = document.getElementById("rbIn"), msg = document.getElementById("rbMsg");
      form.onsubmit = function (ev) {
        ev.preventDefault();
        var g = norm(input.value);
        if (!g) return;
        if (d.rebus.a.some(function (a) { return norm(a) === g; })) { st.solved = true; saveRebus(d.key, st); show(); return; }
        st.wrong++; saveRebus(d.key, st);
        if (st.wrong === 2 || st.wrong === 4) { puzzle(); msg = document.getElementById("rbMsg"); input = document.getElementById("rbIn"); }
        msg.textContent = "Not quite - try again.";
        msg.className = "rb-msg bad";
        form = document.getElementById("rbForm");
        form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
        input.select();
      };
      var give = document.getElementById("rbGive");
      if (give) give.onclick = function () { st.solved = true; saveRebus(d.key, st); show(); };
    }
    if (!d.rebus || st.solved) show(); else puzzle();

    var pad = loadPad(d.key);
    var cells = app.querySelectorAll(".cell");
    var answer = document.getElementById("answer");
    function paint() {
      cells.forEach(function (el, i) {
        el.classList.toggle("no", pad[i] === 1);
        el.classList.toggle("yes", pad[i] === 2);
      });
      // A digit is known when it's marked sure, or when it's the only one not crossed out.
      var html = "";
      for (var r = 0; r < 4; r++) {
        var sure = -1, open = [];
        for (var c = 0; c < 10; c++) { var v = pad[r * 10 + c]; if (v === 2) sure = c; if (v !== 1) open.push(c); }
        var known = sure >= 0 ? sure : open.length === 1 ? open[0] : -1;
        html += '<span class="' + (known >= 0 ? "known" : "") + '">' + (known >= 0 ? known : "?") + '</span>';
      }
      answer.innerHTML = html;
    }
    cells.forEach(function (el) {
      el.addEventListener("click", function () {
        var i = +el.getAttribute("data-i"), row = Math.floor(i / 10);
        pad[i] = (pad[i] + 1) % 3;
        if (pad[i] === 2) for (var c = 0; c < 10; c++) { var j = row * 10 + c; if (j !== i && pad[j] === 2) pad[j] = 0; }
        savePad(d.key, pad); paint();
      });
    });
    document.getElementById("padReset").onclick = function () {
      for (var i = 0; i < 40; i++) pad[i] = 0;
      savePad(d.key, pad); paint();
    };
    paint();
  }

  function go() { var d = parse(); if (d) render(d); else renderError(); }
  go();
  window.addEventListener("hashchange", go);
})();
</script>
</body>
</html>
